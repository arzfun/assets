<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Правила</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --c1:#b727f9;
    --c2:#5a3ded;
    --c3:#485fd6;
    --glass: rgba(15,10,30,0.38);
    --glass-strong: rgba(15,10,30,0.55);
    --line: rgba(255,255,255,0.14);
    --line-soft: rgba(255,255,255,0.08);
    --text: #f3f1fb;
    --text-dim: rgba(243,241,251,0.62);
    --radius-sm: 12px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: transparent;
    overflow:hidden;
    font-family:'Inter', sans-serif;
    color:var(--text);
    user-select:none;
  }
  ::selection{ background: var(--c1); color:#fff; }

  .bg{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 15% 12%, rgba(183,39,249,0.35), transparent 45%),
      radial-gradient(circle at 88% 82%, rgba(72,95,214,0.38), transparent 50%),
      linear-gradient(135deg, rgba(183,39,249,0.55) 0%, rgba(90,61,237,0.52) 48%, rgba(72,95,214,0.55) 100%);
    background-color: rgba(8,6,18,0.42);
    animation: bgShift 18s ease-in-out infinite alternate;
  }
  @keyframes bgShift{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    100%{ filter:hue-rotate(8deg) brightness(1.05); }
  }
  .bg::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
  }

  .app{
    position:relative; z-index:1;
    height:100vh; width:100vw;
    animation: appIn .38s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes appIn{
    from{ opacity:0; transform: translateY(10px) scale(.985); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  .app.closing{ animation: appOut .28s cubic-bezier(.4,0,1,1) forwards; }
  @keyframes appOut{ to{ opacity:0; transform: translateY(8px) scale(.97); } }

  .topbar{
    position:absolute; top:14px; left:14px; right:14px; z-index:5;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    max-width: 860px; margin: 0 auto;
    pointer-events:none;
  }
  .topbar > *{ pointer-events:auto; }

  .allBtn{
    flex-shrink:0; height:50px; border-radius:999px; border:1px solid var(--line);
    background: var(--glass);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    display:flex; align-items:center; gap:8px; padding:0 18px; cursor:pointer;
    color:var(--text); font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: all .18s cubic-bezier(.3,.8,.4,1.4);
  }
  .allBtn svg{ width:16px; height:16px; flex-shrink:0; }
  .allBtn:hover{ background: linear-gradient(135deg, var(--c1), var(--c2)); border-color: transparent; transform: translateY(-1px); }
  .allBtn:active{ transform: scale(.95); }

  .searchwrap{
    flex:1; min-width:160px; position:relative; display:flex; align-items:center;
    background: transparent;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border:1px solid var(--line);
    border-radius: 999px;
    padding: 0 6px 0 16px;
    height:50px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: border-color .2s, box-shadow .2s;
  }
  .searchwrap:focus-within{
    border-color: rgba(183,39,249,0.65);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 0 3px rgba(183,39,249,0.18), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .searchwrap svg{ flex-shrink:0; opacity:.6; width:19px; height:19px; }
  #search{
    flex:1; height:100%; border:none; outline:none; background:transparent;
    color:var(--text); font-family:'Inter',sans-serif; font-size:15px; font-weight:500;
    padding: 0 10px; min-width:0;
  }
  #search::placeholder{ color: var(--text-dim); font-weight:400; }
  .clearBtn{
    width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.07); color:var(--text-dim);
    opacity:0; transform:scale(.7); pointer-events:none;
    transition: all .18s;
  }
  .clearBtn.show{ opacity:1; transform:scale(1); pointer-events:auto; }
  .clearBtn:hover{ background: rgba(255,255,255,0.14); color:var(--text); }

  .closeBtn{
    flex-shrink:0; width:50px; height:50px; border-radius:50%; border:1px solid var(--line);
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: all .18s cubic-bezier(.3,.8,.4,1.4);
  }
  .closeBtn svg{ width:19px; height:19px; stroke:var(--text); transition: transform .25s; }
  .closeBtn:hover{
    background: linear-gradient(135deg, var(--c1), var(--c3));
    border-color: transparent;
    transform: scale(1.06);
  }
  .closeBtn:hover svg{ transform: rotate(90deg); }
  .closeBtn:active{ transform: scale(.92); }

  .target-banner{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin: 0 auto 12px; max-width:560px;
    padding:9px 16px; border-radius:999px;
    background: rgba(255,255,255,0.05); border:1px solid var(--line-soft);
    font-size:12.5px; font-weight:600; color:var(--text-dim);
    text-align:center;
  }
  .target-banner b{ color:var(--text); }
  .target-banner svg{ width:15px; height:15px; flex-shrink:0; opacity:.75; }

  .meta-line{
    text-align:center; font-size:12px; color:var(--text-dim);
    margin: 0 0 14px 0; letter-spacing:.2px;
    font-weight:500;
  }
  .meta-line b{ color:var(--text); font-weight:700; }

  .stage{
    position:absolute; inset:0; z-index:1; display:flex;
  }

  .scrollarea{
    flex:1; min-width:0; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width:none; -ms-overflow-style:none;
    padding: 96px 30px 30px 18px;
  }
  .scrollarea::-webkit-scrollbar{ display:none; width:0; height:0; }

  .customScroll{
    position:absolute; top:96px; bottom:4px; right:2px; width:24px;
    border-radius:6px; background: transparent;
    opacity:0; transition: opacity .25s;
    pointer-events:none;
    touch-action:none;
  }
  .customScroll.visible{ opacity:1; }
  .scrollThumb{
    position:absolute; left:0; right:0; border-radius:6px;
    background: linear-gradient(180deg, var(--c1), var(--c2), var(--c3));
    cursor: grab;
    box-shadow: 0 0 14px rgba(90,61,237,0.5);
    transition: width .15s, right .15s;
    pointer-events:auto;
    touch-action:none;
  }
  .scrollThumb:hover, .scrollThumb.dragging{ box-shadow: 0 0 20px rgba(183,39,249,0.65); }
  .scrollThumb:active{ cursor:grabbing; }

  .content{ display:flex; flex-direction:column; gap:20px; max-width:820px; margin:0 auto; }

  .section{ display:flex; flex-direction:column; }
  .section-head{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:12px 16px; border-radius:14px;
    background: rgba(255,255,255,0.045); border:1px solid var(--line-soft);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color .18s, background .18s;
  }
  .section-head:hover{ border-color: rgba(183,39,249,0.4); background: rgba(255,255,255,0.07); }
  .section-title{ font-family:'Unbounded',sans-serif; font-weight:700; font-size:13.5px; }
  .section-count{
    font-size:11px; font-weight:700; color:var(--text-dim);
    background: rgba(255,255,255,0.08); padding:3px 9px; border-radius:999px;
  }
  .section-chevron{ margin-left:auto; display:flex; opacity:.7; transition: transform .25s; }
  .section-chevron svg{ width:16px; height:16px; }
  .section.collapsed .section-chevron{ transform: rotate(-90deg); }
  .section-body{
    display:flex; flex-direction:column; gap:10px;
    padding: 12px 2px 2px;
  }
  .section.collapsed .section-body{ display:none; }

  .rule-card{
    position:relative;
    background: rgba(255,255,255,0.035);
    border:1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    opacity:0; transform: translateY(8px);
    animation: cardIn .32s cubic-bezier(.2,.8,.2,1) forwards;
    transition: border-color .18s, background .18s;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .rule-card:hover{ border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }

  .rule-head{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .rule-id{
    flex-shrink:0; font-family:'Unbounded',sans-serif; font-size:10.5px; font-weight:700;
    color:var(--text-dim); background: rgba(255,255,255,0.07);
    padding:3px 8px; border-radius:7px; letter-spacing:.3px;
  }
  .rule-name{ font-weight:700; font-size:14px; color:var(--text); }
  .rule-cat-tag{
    margin-left:auto; font-size:10.5px; font-weight:600; color:var(--text-dim);
    background: rgba(255,255,255,0.05); border:1px solid var(--line-soft);
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .rule-text{ font-size:13px; line-height:1.5; color:var(--text-dim); }

  .punish-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
  .punish-chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px;
    border:1px solid var(--line); background: rgba(255,255,255,0.05);
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--text);
    appearance:none; margin:0;
  }
  .punish-chip .pico{ display:flex; opacity:.85; }
  .punish-chip .pico svg{ width:14px; height:14px; display:block; }
  .punish-chip .pnote{ font-weight:400; color:var(--text-dim); font-size:10.5px; margin-left:2px; white-space:nowrap; }
  .punish-chip.clickable{
    cursor:pointer; border-color: rgba(255,255,255,0.22);
    transition: transform .15s, box-shadow .15s, background .15s, border-color .15s;
  }
  .punish-chip.clickable:hover{
    background: linear-gradient(135deg, var(--c1), var(--c2));
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(90,61,237,0.45);
  }
  .punish-chip.clickable:active{ transform: translateY(0) scale(.96); }
  .punish-chip.picked{ animation: pickPulse .38s ease; }
  @keyframes pickPulse{
    0%{ box-shadow: 0 0 0 0 rgba(183,39,249,0.6); }
    60%{ box-shadow: 0 0 0 14px rgba(183,39,249,0); }
    100%{ box-shadow: 0 0 0 0 rgba(183,39,249,0); }
  }

  .thesis-item{
    display:flex; gap:11px; align-items:baseline;
    padding:11px 15px; border-radius:12px;
    background: rgba(255,255,255,0.03); border:1px solid var(--line-soft);
    font-size:13px; line-height:1.5; color:var(--text-dim);
    opacity:0; transform: translateY(8px);
    animation: cardIn .32s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .thesis-id{
    flex-shrink:0; font-family:'Unbounded',sans-serif; font-size:10.5px; font-weight:700; color:var(--text);
  }

  .state{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding: 20px;
  }
  .spinner{
    width:38px; height:38px; border-radius:50%;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--c1);
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .state p{ margin:0; color:var(--text-dim); font-size:13.5px; max-width:280px; }
  .state .big{ font-family:'Unbounded',sans-serif; font-size:14px; color:var(--text); font-weight:700; }
  .retryBtn{
    margin-top:4px; padding: 9px 20px; border-radius: 999px; border:1px solid var(--line);
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color:#fff; font-weight:700; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
    transition: transform .15s, box-shadow .15s;
  }
  .retryBtn:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px rgba(90,61,237,0.45); }

  /* target ID modal */
  .modalOverlay{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background: rgba(5,3,14,0.6);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding:20px;
    animation: overlayIn .2s ease;
  }
  @keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
  .modalCard{
    width:100%; max-width:360px;
    background: var(--glass-strong);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 22px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    animation: modalIn .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modalIn{ from{ opacity:0; transform: translateY(14px) scale(.96); } to{ opacity:1; transform: translateY(0) scale(1); } }
  .modalTitle{ font-family:'Unbounded',sans-serif; font-weight:700; font-size:15px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .modalTitle svg{ width:18px; height:18px; opacity:.85; flex-shrink:0; }
  .modalSub{ font-size:12.5px; color:var(--text-dim); margin-bottom:16px; line-height:1.4; }
  .modalSub b{ color:var(--text); }
  .modalInput{
    width:100%; height:46px; border-radius:12px; border:1px solid var(--line);
    background: rgba(255,255,255,0.05); color:var(--text); padding:0 14px;
    font-family:'Inter',sans-serif; font-size:14px; font-weight:600; outline:none;
    transition: border-color .18s, box-shadow .18s;
    margin-bottom:16px;
  }
  .modalInput::placeholder{ color:var(--text-dim); font-weight:400; }
  .modalInput:focus{ border-color: rgba(183,39,249,.65); box-shadow: 0 0 0 3px rgba(183,39,249,.18); }
  .modalInput.invalid{ animation: shake .38s; border-color:#ff5f7e; }
  @keyframes shake{
    10%,90%{ transform: translateX(-2px); }
    20%,80%{ transform: translateX(4px); }
    30%,50%,70%{ transform: translateX(-6px); }
    40%,60%{ transform: translateX(6px); }
  }
  .modalActions{ display:flex; gap:10px; }
  .modalBtn{
    flex:1; height:44px; border-radius:999px; border:1px solid var(--line);
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px; cursor:pointer;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .modalCancel{ background: rgba(255,255,255,0.06); color:var(--text); }
  .modalCancel:hover{ background: rgba(255,255,255,0.12); }
  .modalConfirm{ background: linear-gradient(135deg, var(--c1), var(--c2)); color:#fff; border-color:transparent; }
  .modalConfirm:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px rgba(90,61,237,.45); }
  .modalConfirm:active, .modalCancel:active{ transform: scale(.96); }
  .offline-toggle{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:10px 12px; margin-bottom:14px; border-radius:12px;
    background: rgba(255,255,255,0.045); border:1px solid var(--line-soft);
    transition: border-color .18s, background .18s;
    user-select:none;
  }
  .offline-toggle:hover{ border-color: rgba(183,39,249,0.4); background: rgba(255,255,255,0.07); }
  .offline-toggle input{ position:absolute; opacity:0; width:0; height:0; }
  .offline-box{
    flex-shrink:0; width:20px; height:20px; border-radius:6px;
    border:1px solid var(--line); background: rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center;
    transition: background .15s, border-color .15s;
  }
  .offline-box svg{ width:13px; height:13px; color:#fff; opacity:0; transform: scale(.4); transition: all .15s ease; }
  .offline-toggle input:checked + .offline-box{
    background: linear-gradient(135deg, var(--c1), var(--c2)); border-color: transparent;
  }
  .offline-toggle input:checked + .offline-box svg{ opacity:1; transform: scale(1); }
  .offline-label{ font-size:12.5px; font-weight:600; color:var(--text); }
  body.cef .offline-box svg{ transition:none; }

  @media (max-width: 720px){
    .topbar{ top:10px; left:8px; right:8px; }
    .scrollarea{ padding: 108px 20px 24px 10px; }
    .customScroll{ top:108px; }
    .closeBtn, .searchwrap, .allBtn{ height:44px; }
    .closeBtn{ width:44px; }
    .allBtn{ padding:0 14px; }
    .allBtn span{ display:none; }
    .content{ gap:16px; }
    .rule-name{ font-size:13px; }
    .rule-text{ font-size:12.5px; }
    .punish-chip{ font-size:11.5px; padding:5px 10px; }
    .target-banner{ font-size:11.5px; padding:8px 12px; }
  }

  body.cef .bg{ animation:none; }
  body.cef .searchwrap, body.cef .closeBtn, body.cef .allBtn{
    backdrop-filter:none; -webkit-backdrop-filter:none;
    background: rgba(20,14,36,0.72);
  }
  body.cef .section-head, body.cef .rule-card, body.cef .thesis-item{
    backdrop-filter:none; -webkit-backdrop-filter:none;
    background: rgba(255,255,255,0.055);
    animation:none !important; opacity:1 !important; transform:none !important;
  }
  body.cef .rule-card:hover{ background: rgba(255,255,255,0.09); }
  body.cef .punish-chip.clickable{ transition: background .12s, border-color .12s; }
  body.cef .punish-chip.clickable:hover{ transform:none; box-shadow:none; }
  body.cef .punish-chip.picked{ animation:none; box-shadow:0 0 0 2px rgba(183,39,249,0.65); }
  body.cef .allBtn:hover{ transform:none; }
  body.cef .modalOverlay{ backdrop-filter:none; -webkit-backdrop-filter:none; animation:none; }
  body.cef .modalCard{ backdrop-filter:none; -webkit-backdrop-filter:none; background: rgba(20,14,36,0.94); animation:none; }
</style>
</head>
<body>

<div class="bg"></div>

<div class="app" id="app">

  <div class="topbar">
    <button class="allBtn" id="allRulesBtn" style="display:none" title="Показать все правила">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Все правила</span>
    </button>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Поиск правила по названию или тексту…" autocomplete="off" spellcheck="false">
      <button class="clearBtn" id="clearBtn" title="Очистить">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="closeBtn" id="closeBtn" title="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="scrollarea" id="scrollarea">
      <div class="target-banner" id="targetBanner" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
        <span id="targetBannerText"></span>
      </div>
      <div class="meta-line" id="metaLine">&nbsp;</div>
      <div class="content" id="content" style="display:none"></div>

      <div class="state" id="stateLoading" style="display:none">
        <div class="spinner"></div>
        <p class="big">Загрузка правил…</p>
      </div>

      <div class="state" id="stateError" style="display:none">
        <p class="big">Не удалось загрузить правила</p>
        <p>Проверьте соединение — все источники (основной и резервные) недоступны.</p>
        <button class="retryBtn" id="retryBtn">Повторить попытку</button>
      </div>

      <div class="state" id="stateEmpty" style="display:none">
        <p class="big">Ничего не найдено</p>
        <p>Попробуйте изменить поисковый запрос.</p>
      </div>
    </div>

    <div class="customScroll" id="customScroll">
      <div class="scrollThumb" id="scrollThumb"></div>
    </div>
  </div>

</div>

<div class="modalOverlay" id="modalOverlay" style="display:none">
  <div class="modalCard" id="modalCard">
    <div class="modalTitle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
      Кого наказываем?
    </div>
    <div class="modalSub">Наказание: <b id="modalPunishLabel">—</b></div>
    <input class="modalInput" id="modalIdInput" type="text" inputmode="numeric" placeholder="ID игрока" autocomplete="off" spellcheck="false">
    <label class="offline-toggle" id="offlineToggle">
      <input type="checkbox" id="modalOffline">
      <span class="offline-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      <span class="offline-label">Выдать в оффлайне</span>
    </label>
    <div class="modalActions">
      <button class="modalBtn modalCancel" id="modalCancel">Отмена</button>
      <button class="modalBtn modalConfirm" id="modalConfirm">Подтвердить</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const RULES_SOURCES = [
    'https://game-api.arzfun.com/client/json/table/get?key=rules',
    'https://game.arzfun.hhos.net/client/json/table/get?key=rules'
  ];
  const CACHE_KEY = 'arzfun.rules.list';
  const FETCH_TIMEOUT_MS = 7000;
  const ANIMATE_LIMIT = 26;

  const CEF_MODE = !!window.cef;
  if (CEF_MODE) document.body.classList.add('cef');

  const params = new URLSearchParams(window.location.search);
  const PUNISH_ID = params.get('id');
  const PUNISH_TYPE = (params.get('punishtype') || '').toLowerCase().trim();
  const PUNISHABLE = !!PUNISH_ID;
  const NEEDS_TARGET_PROMPT = PUNISH_ID === '-1';

  const PUNISH_LABELS = { jail:'JAIL', mute:'MUTE', ban:'BAN', warn:'WARN', kick:'KICK' };
  const PUNISH_UNITS  = { jail:'мин', mute:'мин', ban:'дней' };

  function basePunishType(t){
    const s = (t || '').toLowerCase().trim();
    return s.replace(/off$/, '');
  }
  const PUNISH_ICONS = {
    jail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
    mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',
    ban: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="5.5" y1="5.5" x2="18.5" y2="18.5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    kick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
    default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/></svg>'
  };

  let SECTIONS = [];
  let currentSig = '';
  let searchTerm = '';
  let pendingPunish = null;

  const els = {
    app: document.getElementById('app'),
    content: document.getElementById('content'),
    search: document.getElementById('search'),
    clearBtn: document.getElementById('clearBtn'),
    closeBtn: document.getElementById('closeBtn'),
    allRulesBtn: document.getElementById('allRulesBtn'),
    metaLine: document.getElementById('metaLine'),
    targetBanner: document.getElementById('targetBanner'),
    targetBannerText: document.getElementById('targetBannerText'),
    scrollarea: document.getElementById('scrollarea'),
    customScroll: document.getElementById('customScroll'),
    scrollThumb: document.getElementById('scrollThumb'),
    stateLoading: document.getElementById('stateLoading'),
    stateError: document.getElementById('stateError'),
    stateEmpty: document.getElementById('stateEmpty'),
    retryBtn: document.getElementById('retryBtn'),
    modalOverlay: document.getElementById('modalOverlay'),
    modalCard: document.getElementById('modalCard'),
    modalPunishLabel: document.getElementById('modalPunishLabel'),
    modalIdInput: document.getElementById('modalIdInput'),
    modalOffline: document.getElementById('modalOffline'),
    offlineToggle: document.getElementById('offlineToggle'),
    modalCancel: document.getElementById('modalCancel'),
    modalConfirm: document.getElementById('modalConfirm'),
  };

  function sendEvent(str){
    console.log(str);
    if (window.cef) { window.cef.SendMessage(str, 5); return; }
  }

  function closeInterface(){
    sendEvent('funRules.close');
    els.app.classList.add('closing');
  }

  function resetPunishType(){
    const url = new URL(window.location.href);
    url.searchParams.delete('punishtype');
    window.location.href = url.toString();
  }

  function fetchWithTimeout(url, controller){
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      fetch(url, { signal: controller.signal, cache: 'no-store' })
        .then(r => { clearTimeout(t); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(resolve)
        .catch(err => { clearTimeout(t); reject(err); });
    });
  }

  function fetchFirstSuccess(urls){
    const targets = urls.filter(Boolean);
    if (!targets.length) return Promise.reject(new Error('no sources'));

    const controllers = targets.map(() => new AbortController());
    let settled = false;
    let pending = targets.length;

    return new Promise((resolve, reject) => {
      targets.forEach((url, i) => {
        fetchWithTimeout(url, controllers[i])
          .then(data => {
            if (settled) return;
            settled = true;
            controllers.forEach((c, j) => { if (j !== i) c.abort(); });
            resolve(data);
          })
          .catch(() => {
            pending--;
            if (pending === 0 && !settled){ settled = true; reject(new Error('all sources failed')); }
          });
      });
    });
  }

  function extractSections(data){
    if (Array.isArray(data)) return data;
    if (data && typeof data === 'object'){
      if (Array.isArray(data.sections)) return data.sections;
      const wrapKeys = ['data','result','response','rules','table'];
      for (const k of wrapKeys){
        const v = data[k];
        if (v && Array.isArray(v.sections)) return v.sections;
        if (Array.isArray(v)) return v;
      }
    }
    return null;
  }

  function readCache(){
    try{
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.sections) && parsed.sections.length) return parsed.sections;
    }catch(e){}
    return null;
  }

  function saveCache(sections){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), sections })); }catch(e){}
  }

  function computeSig(sections){
    let count = 0;
    sections.forEach(s => { count += (s.items ? s.items.length : 0); });
    return sections.length + '|' + count;
  }

  function applySections(list){
    const s = computeSig(list);
    if (s === currentSig) return;
    SECTIONS = list;
    currentSig = s;
    saveCache(list);
    renderAll();
  }

  async function loadData(){
    const cached = readCache();
    if (cached) applySections(cached);
    if (!SECTIONS.length) showState('loading');

    try{
      const raw = await fetchFirstSuccess(RULES_SOURCES);
      const sections = extractSections(raw);
      if (sections && sections.length) applySections(sections);
      if (!SECTIONS.length) showState('error');
    }catch(err){
      if (!SECTIONS.length) showState('error');
    }
  }

  function showState(name){
    els.stateLoading.style.display = name === 'loading' ? 'flex' : 'none';
    els.stateError.style.display = name === 'error' ? 'flex' : 'none';
    els.stateEmpty.style.display = name === 'empty' ? 'flex' : 'none';
    els.content.style.display = name === 'content' ? 'flex' : 'none';
  }

  function normalize(s){ return (s || '').toString().toLowerCase().trim(); }

  function itemMatches(item, q){
    if (!q) return true;
    const name = normalize(item.name);
    const text = normalize(item.text);
    const id = String(item.id || '');
    return name.includes(q) || text.includes(q) || id.includes(q);
  }

  function formatAmount(type, amount){
    if (amount === undefined || amount === null) return '';
    if (type === 'ban' && amount >= 1000) return 'навсегда';
    if (type === 'warn') return '×' + amount;
    const unit = PUNISH_UNITS[type] || '';
    return amount + (unit ? ' ' + unit : '');
  }

  function punishIcon(type){ return PUNISH_ICONS[type] || PUNISH_ICONS.default; }

  function escapeHtml(s){
    return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function ruleReason(item){
    return `${item.name || item.text || ('Правило ' + item.id)}(${item.id})`;
  }

  function firePunish(type, targetId, amount, reason, chipEl){
    const val = (amount === undefined || amount === null) ? '' : amount;
    const hasDuration = type === 'warn' || type === 'kick';
    const amountOut = hasDuration ? (val === '' ? 0 : val) : val;
    sendEvent(`funRules.punish|${type}|${targetId}|${amountOut}|${reason}`);
    if (chipEl) chipEl.classList.add('picked');
    setTimeout(closeInterface, 260);
  }

  function isModalOpen(){ return els.modalOverlay.style.display === 'flex'; }

  function openTargetModal(pending){
    pendingPunish = pending;
    const amountText = formatAmount(pending.type, pending.amount);
    const label = (PUNISH_LABELS[pending.type] || pending.type) + (amountText ? ' ' + amountText : '');
    const canOffline = pending.type !== 'kick';
    const defaultOffline = canOffline && /off$/i.test(PUNISH_TYPE);
    els.modalPunishLabel.textContent = label;
    els.modalIdInput.value = '';
    els.modalIdInput.classList.remove('invalid');
    els.modalOffline.checked = !!defaultOffline;
    els.offlineToggle.style.display = canOffline ? 'flex' : 'none';
    els.modalIdInput.setAttribute('inputmode', defaultOffline ? 'text' : 'numeric');
    els.modalIdInput.placeholder = defaultOffline ? 'Ник игрока' : 'ID игрока';
    els.modalOverlay.style.display = 'flex';
    requestAnimationFrame(() => els.modalIdInput.focus());
  }

  function closeModal(){
    els.modalOverlay.style.display = 'none';
    pendingPunish = null;
  }

  function confirmModal(){
    const offline = els.modalOffline.checked;
    const val = els.modalIdInput.value.trim();
    if (!val){
      els.modalIdInput.classList.remove('invalid');
      void els.modalIdInput.offsetWidth;
      els.modalIdInput.classList.add('invalid');
      return;
    }
    if (!pendingPunish){ closeModal(); return; }
    const type = offline ? pendingPunish.type + 'off' : pendingPunish.type;
    firePunish(type, val, pendingPunish.amount, pendingPunish.reason, pendingPunish.chipEl);
    closeModal();
  }

  function buildPunishChip(item, p, clickable){
    const chip = document.createElement(clickable ? 'button' : 'div');
    chip.className = 'punish-chip' + (clickable ? ' clickable' : '');
    if (clickable) chip.type = 'button';

    const ico = document.createElement('span');
    ico.className = 'pico';
    ico.innerHTML = punishIcon(p.type);
    chip.appendChild(ico);

    const label = document.createElement('span');
    label.className = 'ptxt';
    const amountText = formatAmount(p.type, p.amount);
    label.textContent = (PUNISH_LABELS[p.type] || p.type) + (amountText ? ' ' + amountText : '');
    chip.appendChild(label);

    if (p.note){
      const note = document.createElement('span');
      note.className = 'pnote';
      note.textContent = '· ' + p.note;
      chip.appendChild(note);
    }

    if (clickable){
      chip.addEventListener('click', () => {
        const reason = ruleReason(item);
        if (NEEDS_TARGET_PROMPT){
          openTargetModal({ type: p.type, amount: p.amount, reason: reason, chipEl: chip });
        } else {
          firePunish(p.type, PUNISH_ID, p.amount, reason, chip);
        }
      });
    }
    return chip;
  }

  function buildRuleCard(item, opts){
    opts = opts || {};
    const card = document.createElement('div');
    card.className = 'rule-card';

    const head = document.createElement('div');
    head.className = 'rule-head';

    const idChip = document.createElement('span');
    idChip.className = 'rule-id';
    idChip.textContent = item.id;
    head.appendChild(idChip);

    if (item.name){
      const nm = document.createElement('span');
      nm.className = 'rule-name';
      nm.textContent = item.name;
      head.appendChild(nm);
    }

    if (opts.categoryTitle){
      const tag = document.createElement('span');
      tag.className = 'rule-cat-tag';
      tag.textContent = opts.categoryTitle;
      head.appendChild(tag);
    }

    card.appendChild(head);

    if (item.text){
      const txt = document.createElement('div');
      txt.className = 'rule-text';
      txt.textContent = item.text;
      card.appendChild(txt);
    }

    if (item.punishment && item.punishment.length){
      const row = document.createElement('div');
      row.className = 'punish-row';
      item.punishment.forEach(p => row.appendChild(buildPunishChip(item, p, PUNISHABLE)));
      card.appendChild(row);
    }

    return card;
  }

  function buildThesisItem(item){
    const row = document.createElement('div');
    row.className = 'thesis-item';
    const idChip = document.createElement('span');
    idChip.className = 'thesis-id';
    idChip.textContent = item.id;
    const txt = document.createElement('span');
    txt.className = 'thesis-text';
    txt.textContent = item.text;
    row.appendChild(idChip);
    row.appendChild(txt);
    return row;
  }

  function buildSection(section, matchedItems, forceRuleCard){
    const wrap = document.createElement('div');
    wrap.className = 'section';

    const head = document.createElement('div');
    head.className = 'section-head';

    const title = document.createElement('span');
    title.className = 'section-title';
    title.textContent = section.title;

    const count = document.createElement('span');
    count.className = 'section-count';
    count.textContent = matchedItems.length;

    const chevron = document.createElement('span');
    chevron.className = 'section-chevron';
    chevron.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

    head.appendChild(title);
    head.appendChild(count);
    head.appendChild(chevron);
    head.addEventListener('click', () => wrap.classList.toggle('collapsed'));
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'section-body';
    let animIdx = 0;
    matchedItems.forEach(item => {
      const useRuleCard = forceRuleCard || section.kind === 'punishments';
      const el = useRuleCard ? buildRuleCard(item) : buildThesisItem(item);
      if (CEF_MODE || animIdx >= ANIMATE_LIMIT){
        el.style.animation = 'none';
        el.style.opacity = '1';
        el.style.transform = 'none';
      } else {
        el.style.animationDelay = (animIdx * 12) + 'ms';
      }
      animIdx++;
      body.appendChild(el);
    });
    wrap.appendChild(body);

    return wrap;
  }

  function renderAll(){
    const q = normalize(searchTerm);
    els.content.innerHTML = '';

    if (PUNISH_TYPE){
      renderPunishFiltered(q);
      return;
    }

    const onlyPunishable = PUNISHABLE;

    let totalMatched = 0;
    const frag = document.createDocumentFragment();

    SECTIONS.forEach(section => {
      const items = section.items || [];
      const matched = items.filter(it => {
        if (onlyPunishable && (!it.punishment || !it.punishment.length)) return false;
        return itemMatches(it, q);
      });
      totalMatched += matched.length;
      if (!matched.length) return;
      frag.appendChild(buildSection(section, matched, onlyPunishable));
    });

    els.content.appendChild(frag);
    showState(totalMatched ? 'content' : 'empty');
    updateMeta(totalMatched, q, null, onlyPunishable);
    requestAnimationFrame(updateCustomScroll);
  }

  function renderPunishFiltered(q){
    const label = PUNISH_LABELS[PUNISH_TYPE] || (PUNISH_TYPE.charAt(0).toUpperCase() + PUNISH_TYPE.slice(1));
    const frag = document.createDocumentFragment();
    let matchedCount = 0;
    let animIdx = 0;

    SECTIONS.forEach(section => {
      (section.items || []).forEach(item => {
        if (!item.punishment || !item.punishment.some(p => p.type === PUNISH_TYPE || basePunishType(p.type) === basePunishType(PUNISH_TYPE))) return;
        if (!itemMatches(item, q)) return;
        matchedCount++;
        const card = buildRuleCard(item, { categoryTitle: section.title });
        if (CEF_MODE || animIdx >= ANIMATE_LIMIT){
          card.style.animation = 'none';
          card.style.opacity = '1';
          card.style.transform = 'none';
        } else {
          card.style.animationDelay = (animIdx * 12) + 'ms';
        }
        animIdx++;
        frag.appendChild(card);
      });
    });

    els.content.appendChild(frag);
    showState(matchedCount ? 'content' : 'empty');
    updateMeta(matchedCount, q, label);
    requestAnimationFrame(updateCustomScroll);
  }

  function updateMeta(count, q, punishLabel, onlyPunishable){
    if (punishLabel){
      els.metaLine.innerHTML = q
        ? `Наказание «<b>${escapeHtml(punishLabel)}</b>» · запрос «${escapeHtml(searchTerm)}»: <b>${count}</b>`
        : `Наказание «<b>${escapeHtml(punishLabel)}</b>» — найдено правил: <b>${count}</b>`;
    } else if (onlyPunishable){
      els.metaLine.innerHTML = q
        ? `Правила с наказанием · запрос «${escapeHtml(searchTerm)}»: <b>${count}</b>`
        : `Правила с наказанием — найдено: <b>${count}</b>`;
    } else {
      els.metaLine.innerHTML = q
        ? `Найдено по запросу «${escapeHtml(searchTerm)}»: <b>${count}</b>`
        : `Правила сервера — категорий: <b>${SECTIONS.length}</b>`;
    }
  }

  function initTargetBanner(){
    if (!PUNISHABLE) return;
    els.targetBanner.style.display = 'flex';
    els.targetBannerText.innerHTML = NEEDS_TARGET_PROMPT
      ? 'ID игрока будет запрошен при выборе наказания'
      : `Вы наказываете игрока с ID <b>${escapeHtml(PUNISH_ID)}</b>`;
  }

  function updateCustomScroll(){
    const sa = els.scrollarea;
    const trackHeight = els.customScroll.clientHeight;
    const scrollable = sa.scrollHeight - sa.clientHeight;

    if (scrollable <= 4){
      els.customScroll.classList.remove('visible');
      return;
    }
    els.customScroll.classList.add('visible');

    const ratio = sa.clientHeight / sa.scrollHeight;
    const thumbHeight = Math.max(30, trackHeight * ratio);
    const thumbTop = (sa.scrollTop / scrollable) * (trackHeight - thumbHeight);

    els.scrollThumb.style.height = thumbHeight + 'px';
    els.scrollThumb.style.transform = `translateY(${thumbTop}px)`;
  }

  let scrollRAF = null;
  els.scrollarea.addEventListener('scroll', () => {
    if (scrollRAF) return;
    scrollRAF = requestAnimationFrame(() => {
      scrollRAF = null;
      updateCustomScroll();
    });
  }, { passive: true });

  let dragging = false;
  let dragStartY = 0;
  let dragStartScrollTop = 0;

  function onPointerDown(e){
    dragging = true;
    els.scrollThumb.classList.add('dragging');
    dragStartY = e.clientY;
    dragStartScrollTop = els.scrollarea.scrollTop;
    try{ els.scrollThumb.setPointerCapture(e.pointerId); }catch(err){}
  }

  function onPointerMove(e){
    if (!dragging) return;
    const sa = els.scrollarea;
    const trackHeight = els.customScroll.clientHeight;
    const thumbHeight = els.scrollThumb.offsetHeight;
    const scrollable = sa.scrollHeight - sa.clientHeight;
    const trackRange = trackHeight - thumbHeight;
    if (trackRange <= 0 || scrollable <= 0) return;
    const deltaY = e.clientY - dragStartY;
    const deltaScroll = (deltaY / trackRange) * scrollable;
    sa.scrollTop = dragStartScrollTop + deltaScroll;
  }

  function onPointerUp(e){
    dragging = false;
    els.scrollThumb.classList.remove('dragging');
    try{ els.scrollThumb.releasePointerCapture(e.pointerId); }catch(err){}
  }

  els.scrollThumb.addEventListener('pointerdown', onPointerDown);
  els.scrollThumb.addEventListener('pointermove', onPointerMove);
  els.scrollThumb.addEventListener('pointerup', onPointerUp);
  els.scrollThumb.addEventListener('pointercancel', onPointerUp);

  let searchDebounce;
  els.search.addEventListener('input', (e) => {
    searchTerm = e.target.value;
    els.clearBtn.classList.toggle('show', !!searchTerm);
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(renderAll, 200);
  });

  els.clearBtn.addEventListener('click', () => {
    els.search.value = '';
    searchTerm = '';
    els.clearBtn.classList.remove('show');
    renderAll();
    els.search.focus();
  });

  els.closeBtn.addEventListener('click', closeInterface);
  els.allRulesBtn.addEventListener('click', resetPunishType);
  els.retryBtn.addEventListener('click', loadData);

  els.modalCancel.addEventListener('click', closeModal);
  els.modalConfirm.addEventListener('click', confirmModal);
  els.modalOffline.addEventListener('change', () => {
    const off = els.modalOffline.checked;
    if (off){
      els.modalIdInput.setAttribute('inputmode', 'text');
      els.modalIdInput.placeholder = 'Ник игрока';
      requestAnimationFrame(() => els.modalIdInput.focus());
    } else {
      els.modalIdInput.setAttribute('inputmode', 'numeric');
      els.modalIdInput.placeholder = 'ID игрока';
      requestAnimationFrame(() => els.modalIdInput.focus());
    }
  });
  els.modalIdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); confirmModal(); }
    e.stopPropagation();
  });
  els.modalOverlay.addEventListener('click', (e) => { if (e.target === els.modalOverlay) closeModal(); });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){
      if (isModalOpen()){ closeModal(); return; }
      closeInterface();
      return;
    }
    if (document.activeElement === els.search || document.activeElement === els.modalIdInput) return;
    if (e.key === '/'){ e.preventDefault(); els.search.focus(); }
  });

  let resizeDebounce;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => { requestAnimationFrame(updateCustomScroll); }, 160);
  });

  if (PUNISH_TYPE) els.allRulesBtn.style.display = 'flex';

  initTargetBanner();
  loadData();

})();
</script>
</body>
</html>
